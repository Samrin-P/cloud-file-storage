<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Cloud File Storage</title>
</head>

<body>

    <h1>Cloud File Storage Dashboard</h1>

    <p>Welcome to your file management dashboard.</p>

    <hr>

    <h2>Upload File</h2>

    <form method="POST" enctype="multipart/form-data">

        <input type="file" name="file" required>

        <br><br>

        <button type="submit">Upload File</button>

    </form>

    <hr>

    <h2>Download Test File</h2>

    <p>After uploading your Excel file, use the link below:</p>

    <a href="/download/sample_database.xlsx">
        Download Excel File
    </a>

    <br><br>

    <a href="/logout">
        <button>Logout</button>
    </a>

</body>
</html>
